<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Tool — Парсер и рассылка</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1a1a1a; }
    header { background: #1e3a5f; color: #fff; padding: 1rem 2rem; }
    main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    section { background: #fff; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h2 { margin-top: 0; font-size: 1.1rem; }
    label { display: block; margin-bottom: .35rem; font-weight: 600; font-size: .9rem; }
    input, textarea, select, button { font: inherit; }
    input[type="text"], input[type="file"], textarea { width: 100%; padding: .5rem; border: 1px solid #ccc; border-radius: 4px; margin-bottom: .75rem; }
    textarea { min-height: 100px; resize: vertical; }
    button { background: #1e3a5f; color: #fff; border: none; padding: .55rem 1rem; border-radius: 4px; cursor: pointer; margin-right: .5rem; margin-bottom: .5rem; }
    button.secondary { background: #5a6a7a; }
    button.danger { background: #c0392b; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .stats { display: flex; gap: 1rem; flex-wrap: wrap; }
    .stat { background: #eef2f7; padding: .75rem 1rem; border-radius: 6px; min-width: 120px; }
    .stat strong { display: block; font-size: 1.4rem; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; position: sticky; top: 0; }
    .badge { display: inline-block; padding: .15rem .45rem; border-radius: 4px; font-size: .75rem; }
    .badge.valid { background: #d4edda; color: #155724; }
    .badge.invalid { background: #f8d7da; color: #721c24; }
    .badge.pending { background: #fff3cd; color: #856404; }
    .badge.risky { background: #e2d9f3; color: #4a235a; }
    .table-wrap { max-height: 400px; overflow: auto; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end; }
    .row > div { flex: 1; min-width: 200px; }
    .msg { padding: .6rem; border-radius: 4px; margin-bottom: .75rem; }
    .msg.ok { background: #d4edda; }
    .msg.err { background: #f8d7da; }
    .oauth-btns a { display: inline-block; margin-right: .5rem; margin-bottom: .5rem; padding: .55rem 1rem; background: #4285f4; color: #fff; text-decoration: none; border-radius: 4px; font-size: .9rem; }
    .oauth-btns a.outlook { background: #0078d4; }
    .consent { display: flex; align-items: center; gap: .5rem; margin: .75rem 0; }
    .consent input { width: auto; }
  </style>
</head>
<body>
  <header>
    <h1>Email Tool</h1>
    <p style="margin:0;opacity:.85">Парсер почты, проверка, Excel, рассылка</p>
  </header>
  <main>
    <div id="message"></div>

    <section>
      <h2>Статистика</h2>
      <div class="stats" id="stats">
        <div class="stat"><strong id="stat-total">0</strong>Всего</div>
        <div class="stat"><strong id="stat-working">0</strong>Рабочие</div>
        <div class="stat"><strong id="stat-pending">0</strong>Ожидают</div>
        <div class="stat"><strong id="stat-invalid">0</strong>Нерабочие</div>
      </div>
    </section>

    <section>
      <h2>Импорт</h2>
      <div class="row">
        <div>
          <label>Файл (CSV, TXT, Excel)</label>
          <input type="file" id="file-input" accept=".csv,.txt,.xlsx,.xls" />
          <button onclick="importFile()">Загрузить файл</button>
        </div>
        <div>
          <label>URL страниц (по одному на строку)</label>
          <textarea id="urls-input" placeholder="https://example.com/contacts"></textarea>
          <button onclick="importUrls()">Парсить URL</button>
        </div>
      </div>
      <h3 style="font-size:.95rem;margin:1rem 0 .5rem">Почтовые ящики</h3>
      <div class="oauth-btns">
        <a href="/api/auth/google">Подключить Gmail</a>
        <a href="/api/auth/microsoft" class="outlook">Подключить Outlook</a>
        <button class="secondary" onclick="importMailbox('mailru')">Импорт Mail.ru (IMAP)</button>
        <button class="secondary" onclick="importMailbox('gmail')">Импорт из Gmail</button>
        <button class="secondary" onclick="importMailbox('outlook')">Импорт из Outlook</button>
      </div>
      <div style="margin-top:.75rem">
        <button onclick="validateAll()">Проверить все (рабочая/нет)</button>
        <button class="secondary" onclick="exportExcel()">Экспорт Excel</button>
        <button class="secondary" onclick="exportExcel(true)">Excel — только рабочие</button>
      </div>
    </section>

    <section>
      <h2>Контакты</h2>
      <div class="row" style="margin-bottom:.75rem">
        <div>
          <label>Фильтр</label>
          <select id="filter-working" onchange="loadContacts()">
            <option value="">Все</option>
            <option value="true">Только рабочие</option>
            <option value="false">Только нерабочие</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Источник</th>
              <th>Статус</th>
              <th>Рабочая</th>
              <th>Имя</th>
              <th>Компания</th>
              <th>Ошибка</th>
            </tr>
          </thead>
          <tbody id="contacts-body"></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Рассылка</h2>
      <label>Описание продукта (для ИИ)</label>
      <textarea id="ai-prompt" placeholder="Реклама CRM-системы для малого бизнеса..."></textarea>
      <button onclick="generateAi()">Сгенерировать текст (ИИ)</button>

      <label style="margin-top:1rem">Тема письма</label>
      <input type="text" id="campaign-subject" />

      <label>Текст письма (HTML)</label>
      <textarea id="campaign-body" style="min-height:140px"></textarea>

      <div class="consent">
        <input type="checkbox" id="consent" />
        <label for="consent" style="margin:0;font-weight:normal">У меня есть согласие получателей на рассылку</label>
      </div>

      <button onclick="createAndSend()">Создать и отправить на все рабочие</button>
      <button class="secondary" onclick="createOnly()">Только сохранить кампанию</button>
    </section>
  </main>

  <script>
    const API = '/api';

    function showMsg(text, ok = true) {
      const el = document.getElementById('message');
      el.className = 'msg ' + (ok ? 'ok' : 'err');
      el.textContent = text;
      setTimeout(() => { el.textContent = ''; el.className = ''; }, 5000);
    }

    async function loadStats() {
      const res = await fetch(`${API}/contacts/stats`);
      const s = await res.json();
      document.getElementById('stat-total').textContent = s.total;
      document.getElementById('stat-working').textContent = s.working;
      document.getElementById('stat-pending').textContent = s.pending;
      document.getElementById('stat-invalid').textContent = s.invalid;
    }

    async function loadContacts() {
      const filter = document.getElementById('filter-working').value;
      let url = `${API}/contacts`;
      if (filter) url += `?isWorking=${filter}`;
      const res = await fetch(url);
      const contacts = await res.json();
      const tbody = document.getElementById('contacts-body');
      tbody.innerHTML = contacts.map(c => `
        <tr>
          <td>${esc(c.email)}</td>
          <td>${esc(c.source)}</td>
          <td><span class="badge ${c.status}">${c.status}</span></td>
          <td>${c.isWorking === null ? '—' : c.isWorking ? 'да' : 'нет'}</td>
          <td>${esc(c.name || '')}</td>
          <td>${esc(c.company || '')}</td>
          <td>${esc(c.lastError || '')}</td>
        </tr>
      `).join('');
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    async function importFile() {
      const input = document.getElementById('file-input');
      if (!input.files[0]) return showMsg('Выберите файл', false);
      const fd = new FormData();
      fd.append('file', input.files[0]);
      const res = await fetch(`${API}/contacts/import/file`, { method: 'POST', body: fd });
      const data = await res.json();
      showMsg(`Импортировано: ${data.imported}, пропущено: ${data.skipped}`);
      await refresh();
    }

    async function importUrls() {
      const text = document.getElementById('urls-input').value.trim();
      const urls = text.split('\n').map(u => u.trim()).filter(Boolean);
      if (!urls.length) return showMsg('Введите URL', false);
      const res = await fetch(`${API}/contacts/import/urls`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ urls }),
      });
      const data = await res.json();
      showMsg(`Импортировано: ${data.imported}, пропущено: ${data.skipped}`);
      await refresh();
    }

    async function importMailbox(provider) {
      const res = await fetch(`${API}/contacts/import/mailbox`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        return showMsg(err.message || 'Ошибка импорта', false);
      }
      const data = await res.json();
      showMsg(`Импортировано: ${data.imported}, пропущено: ${data.skipped}`);
      await refresh();
    }

    async function validateAll() {
      const res = await fetch(`${API}/contacts/validate`, { method: 'POST' });
      const data = await res.json();
      showMsg(`В очереди: ${data.queued}, обработано: ${data.processed}`);
      setTimeout(refresh, 2000);
    }

    function exportExcel(workingOnly = false) {
      let url = `${API}/contacts/export`;
      if (workingOnly) url += '?isWorking=true';
      window.open(url, '_blank');
    }

    async function generateAi() {
      const prompt = document.getElementById('ai-prompt').value.trim();
      if (!prompt) return showMsg('Введите описание', false);
      const res = await fetch(`${API}/campaigns/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ productDescription: prompt }),
      });
      const data = await res.json();
      document.getElementById('campaign-subject').value = data.subject;
      document.getElementById('campaign-body').value = data.bodyHtml;
      showMsg('Текст сгенерирован');
    }

    async function createOnly() {
      const subject = document.getElementById('campaign-subject').value.trim();
      const bodyHtml = document.getElementById('campaign-body').value.trim();
      if (!subject || !bodyHtml) return showMsg('Заполните тему и текст', false);
      const res = await fetch(`${API}/campaigns`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subject, bodyHtml }),
      });
      const data = await res.json();
      showMsg(`Кампания создана: ${data.id}`);
    }

    async function createAndSend() {
      if (!document.getElementById('consent').checked) {
        return showMsg('Подтвердите согласие получателей', false);
      }
      const subject = document.getElementById('campaign-subject').value.trim();
      const bodyHtml = document.getElementById('campaign-body').value.trim();
      if (!subject || !bodyHtml) return showMsg('Заполните тему и текст', false);

      const createRes = await fetch(`${API}/campaigns`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subject, bodyHtml }),
      });
      const campaign = await createRes.json();

      const sendRes = await fetch(`${API}/campaigns/${campaign.id}/send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ consentConfirmed: true }),
      });
      if (!sendRes.ok) {
        const err = await sendRes.json().catch(() => ({}));
        return showMsg(err.message || 'Ошибка отправки', false);
      }
      const result = await sendRes.json();
      showMsg(`Рассылка запущена: ${result.total} получателей`);
    }

    async function refresh() {
      await loadStats();
      await loadContacts();
    }

    const params = new URLSearchParams(location.search);
    if (params.get('connected')) {
      showMsg(`Подключено: ${params.get('connected')}`);
      history.replaceState({}, '', '/');
    }

    refresh();
  </script>
</body>
</html>
